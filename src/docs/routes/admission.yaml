# swagger/routes/admission.yaml

/api/{tenant}/admission/checks:
  post:
    tags:
      - Admission
    summary: Check one scan at the entrance of a facility
    description: |
      The route of the devices at the entrances (glossary „Einlassgerät“).
      A device authorizes itself with the key it was registered with, not
      with a session; it checks passes of its own facility only. Reads the
      code, verifies the QR tag, looks up the pass, decides in six steps
      (code, validity, usage, presence, lock period, capacity) and writes a
      granted entry or an exit into the usage log of the pass.

      A refusal is a `200` with `result: denied`, its step, its reason and
      the German text for the staff. The answer carries no booking, payment
      or contact data.

      Idempotent by `scanId`: a scan sent again gets the first answer and
      enters nothing twice. Two devices that scan the same pass at the same
      moment cannot both enter it.

      Limit: 120 checks per device per minute
      (`RATE_LIMIT_ADMISSION_CHECKS_PER_DEVICE`).
    security:
      - admissionDeviceKey: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdmissionCheckRequest"
          example:
            code: "BLT1.7KQ2M9XD4RTBH3WS.4D2KQ7M9XR3T8HW1"
            scanId: "gate-1-000183"
            direction: entry
    responses:
      "200":
        description: The answer of the check, also for a refusal
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdmissionCheckAnswer"
            example:
              scanId: "gate-1-000183"
              result: denied
              step: 4
              reason: already_present
              message: "Bereits eingecheckt seit 09:15, kein Austritt erfasst"
              notices: []
              pass:
                id: "pass-7KQ2"
                label: "Saisonkarte · Erwachsene"
                holder: null
                state: present
                validUntil: 1821045600000
                quotaLeft: null
      "400":
        description: "`invalid_code`, `invalid_scan_id` or `invalid_direction`"
      "401":
        description: "`device_key_missing` or `device_unknown` (no device of this tenant)"
      "403":
        description: "`device_blocked`"
      "404":
        description: "`admission_facility_not_found`: the device's facility has no admission settings"
      "409":
        description: >-
          `scan_in_progress` - the same `scanId` is still being checked;
          `admission_check_contended` - three attempts in a row lost the race
          for the pass. Both: retry after a second
      "429":
        description: "`too_many_checks`, with `Retry-After`"
      "503":
        description: "`admission_not_configured`: the instance has no `ADMISSION_CODE_SECRET`"

/api/{tenant}/admission/devices:
  get:
    tags:
      - Admission
    summary: List the devices at the entrances
    description: |
      The devices of the tenant, or of one facility, with status and
      history. Never the key or its hash. For whoever may read bookables
      (`admission.read`).
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - name: facilityId
        in: query
        required: false
        schema:
          type: string
    responses:
      "200":
        description: The devices, oldest first
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/AdmissionDevice"
      "400":
        description: "`invalid_facility_id`"
      "401":
        description: Not signed in
      "403":
        description: Without `admission.read`
  post:
    tags:
      - Admission
    summary: Register a device for a facility
    description: |
      Registers a device at the entrance of a facility with admission
      settings and answers its key, once: the platform keeps only its
      SHA-256. The answer is sent with `Cache-Control: no-store`. For the
      tenant owner (`admission.write`).
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - facilityId
              - name
            properties:
              facilityId:
                type: string
              name:
                type: string
                minLength: 1
                maxLength: 80
          example:
            facilityId: "freibad"
            name: "Drehkreuz Nord"
    responses:
      "201":
        description: The device and its key, shown this once
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdmissionDeviceWithKey"
      "400":
        description: "`invalid_facility_id` or `invalid_device_name`"
      "401":
        description: Not signed in
      "403":
        description: Without `admission.write`
      "404":
        description: "`admission_facility_not_found`: the facility has no admission settings"

/api/{tenant}/admission/devices/{deviceId}/block:
  post:
    tags:
      - Admission
    summary: Block a device
    description: |
      Its next check answers `403 device_blocked`; the other devices keep
      working. Sent twice, it changes nothing. For the tenant owner
      (`admission.write`).
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/AdmissionDeviceIdParam"
    responses:
      "200":
        description: The blocked device
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdmissionDevice"
      "401":
        description: Not signed in
      "403":
        description: Without `admission.write`
      "404":
        description: "`admission_device_not_found`"

/api/{tenant}/admission/devices/{deviceId}/unblock:
  post:
    tags:
      - Admission
    summary: Unblock a device
    description: |
      The device checks again, with the key it has. For the tenant owner
      (`admission.write`).
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/AdmissionDeviceIdParam"
    responses:
      "200":
        description: The active device
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdmissionDevice"
      "401":
        description: Not signed in
      "403":
        description: Without `admission.write`
      "404":
        description: "`admission_device_not_found`"

/api/{tenant}/admission/devices/{deviceId}/renew:
  post:
    tags:
      - Admission
    summary: Give a device a new key
    description: |
      The old key ends at once; a blocked device stays blocked. The new key
      is answered once, with `Cache-Control: no-store`. For the tenant owner
      (`admission.write`).
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/AdmissionDeviceIdParam"
    responses:
      "200":
        description: The device and its new key, shown this once
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdmissionDeviceWithKey"
      "401":
        description: Not signed in
      "403":
        description: Without `admission.write`
      "404":
        description: "`admission_device_not_found`"

/api/{tenant}/admission/facilities:
  get:
    tags:
      - Admission
    summary: List the admission settings of the facilities
    description: For whoever may read bookables (`admission.read`).
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
    responses:
      "200":
        description: The settings, by facility
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/AdmissionFacilitySettings"
      "401":
        description: Not signed in
      "403":
        description: Without `admission.read`

/api/{tenant}/admission/facilities/{facilityId}:
  get:
    tags:
      - Admission
    summary: Read the admission settings of a facility
    description: For whoever may read bookables (`admission.read`).
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/AdmissionFacilityIdParam"
    responses:
      "200":
        description: The settings
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdmissionFacilitySettings"
      "401":
        description: Not signed in
      "403":
        description: Without `admission.read`
      "404":
        description: "`admission_facility_not_found`"
  put:
    tags:
      - Admission
    summary: Create or replace the admission settings of a facility
    description: |
      The settings of a bookable of the tenant, whole: a missing field takes
      its default. The reset mark is the daily reset's and stays as it was.
      For the tenant owner (`admission.write`).
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/TenantParam"
      - $ref: "#/components/parameters/AdmissionFacilityIdParam"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdmissionFacilitySettingsInput"
          example:
            resetTime: "03:00"
            zone: "Europe/Berlin"
            maxStayMinutes: 240
            exitScan: false
            warnings:
              refusedAttempts: 2
              entriesPerDay: 3
    responses:
      "200":
        description: The settings as kept
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdmissionFacilitySettings"
      "400":
        description: >-
          `invalid_settings`, `invalid_reset_time`, `invalid_zone`,
          `invalid_max_stay`, `invalid_exit_scan` or `invalid_warnings`
          (with `params.field`)
      "401":
        description: Not signed in
      "403":
        description: Without `admission.write`
      "404":
        description: "`bookable_not_found`: the tenant has no such bookable"

components:
  parameters:
    AdmissionDeviceIdParam:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
    AdmissionFacilityIdParam:
      name: facilityId
      in: path
      required: true
      description: The id of the facility's bookable
      schema:
        type: string
  securitySchemes:
    admissionDeviceKey:
      type: apiKey
      in: header
      name: Authorization
      description: |
        `Device <key>`: the key a device got at its registration, `adm_`
        and 43 symbols of base64url. Shown once; the platform keeps only its
        SHA-256. Not a session and not a bearer token.
  schemas:
    AdmissionCheckRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          maxLength: 256
          description: >-
            What the scanner read (QR payload `BLT1.<identifier>.<tag>`) or
            the staff typed (the identifier, case and dashes ignored)
        scanId:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,64}$"
          description: >-
            The device's id of this scan; the same id sent again gets the
            first answer. Without it, every request is a scan of its own
        direction:
          type: string
          enum: [entry, exit]
          default: entry
    AdmissionCheckAnswer:
      type: object
      properties:
        scanId:
          type: string
        result:
          type: string
          enum: [granted, granted_with_notice, denied, exited, not_present]
        step:
          type: integer
          nullable: true
          minimum: 1
          maximum: 6
          description: The refusing step, null unless denied
        reason:
          type: string
          nullable: true
          description: >-
            Reason of a refusal, e.g. `code_not_genuine`, `expired`,
            `quota_exhausted`, `already_present`, `lock_period`,
            `capacity_reached` (docs/admission.md)
        message:
          type: string
          description: German text for the staff
        notices:
          type: array
          description: What the staff is told without a refusal (Pos. 5.5)
          items:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
        pass:
          type: object
          nullable: true
          description: The pass as the staff may see it, null unless the code resolved to a pass
          properties:
            id:
              type: string
            label:
              type: string
            holder:
              type: string
              nullable: true
              description: Name of the holder of a personal pass
            state:
              type: string
              enum: [issued, absent, present, consumed, expired, blocked, void]
            validUntil:
              type: integer
              nullable: true
              description: End of validity, epoch milliseconds (exclusive)
            quotaLeft:
              type: integer
              nullable: true
    AdmissionDevice:
      type: object
      properties:
        id:
          type: string
        facilityId:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, blocked]
        createdAt:
          type: integer
          description: Epoch milliseconds
        createdBy:
          type: string
          nullable: true
        blockedAt:
          type: integer
          nullable: true
        blockedBy:
          type: string
          nullable: true
        renewedAt:
          type: integer
          nullable: true
        renewedBy:
          type: string
          nullable: true
        lastSeenAt:
          type: integer
          nullable: true
          description: Last check, written at most once a minute
    AdmissionDeviceWithKey:
      type: object
      properties:
        key:
          type: string
          pattern: "^adm_[A-Za-z0-9_-]{43}$"
          description: "For the device's `Authorization: Device <key>`; shown once"
        device:
          $ref: "#/components/schemas/AdmissionDevice"
    AdmissionFacilitySettingsInput:
      type: object
      properties:
        resetTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          default: "03:00"
          description: Start of the business day, in `zone`
        zone:
          type: string
          default: "Europe/Berlin"
          description: IANA time zone
        maxStayMinutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1440
          default: null
          description: Maximum stay; null for none
        exitScan:
          type: boolean
          default: false
        warnings:
          type: object
          nullable: true
          description: Thresholds of the notices, 1 to 100 each
          properties:
            refusedAttempts:
              type: integer
              default: 2
            entriesPerDay:
              type: integer
              default: 3
    AdmissionFacilitySettings:
      allOf:
        - $ref: "#/components/schemas/AdmissionFacilitySettingsInput"
        - type: object
          properties:
            facilityId:
              type: string
            lastResetAt:
              type: integer
              nullable: true
              description: >-
                Business day start up to which the daily reset ran, epoch
                milliseconds
